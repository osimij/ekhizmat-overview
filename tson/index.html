<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eKhizmat · АРМ оператора ЦОН</title>
<!-- Тема до первой отрисовки (design-guide §7: «вспышка темы — это баг»).
     Раньше её ставил boot() ПОСЛЕ await за словарём, и оператор с тёмной темой
     получал белую вспышку на каждой загрузке. Скрипт инлайновый и стоит выше
     стилей намеренно: любой внешний файл — это ещё один раунд до первого кадра.
     Порядок разрешения тот же, что у design-system/js/preferences.js, иначе
     после гидрации тема поменялась бы второй раз. -->
<script>try{var q=new URLSearchParams(location.search).get("theme");var s=localStorage.getItem("ekh.preferences.theme");var t=(q==="dark"||q==="light")?q:(s==="dark"||s==="light")?s:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="/design-system/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/design-system/global.css">
<link rel="stylesheet" href="/apps/tson/app.css">
</head>
<body data-platform="tson">

<a class="skip-link" href="#screen">К содержимому</a>

<!-- Шелл (§3.2). Размывается под замком, поэтому это один узел. -->
<div id="shell" class="shell">
  <header id="topbar" class="topbar"></header>

  <!-- Session bar и stepper существуют только в сессии — не hidden,
       а с пустым содержимым: в них физически нечему быть вне сессии (P1). -->
  <div id="sessionbar" class="sessionbar" hidden></div>
  <div id="stepper" class="stepper-bar" hidden></div>

  <!-- Контейнер данных сессии. wipe() чистит именно его (§2.3.3). -->
  <main id="screen" class="screen" tabindex="-1">
    <div id="session-root"></div>
  </main>
</div>

<!-- Слои поверх шелла -->
<div id="lock-root"></div>
<div id="layers"></div>
<div id="toasts" class="ekh-toast-region ekh-toast-region--top" aria-live="polite" aria-atomic="false"></div>

<!-- §9 — пороги таймера сессии объявляются сюда. Отдельно от тостов: тост
     живёт 4 секунды и уносит текст с собой, а порог «до конца приёма минута»
     должен оставаться доступным скринридеру, пока он верен. -->
<div id="live" class="sr-only" aria-live="polite"></div>

<!-- §7 — окно уже 1280px. Заглушка вне #shell: она не должна размываться.
     Текст лежит в разметке по-русски и переписывается из словаря при старте
     (см. app.js): без словаря АРМ вообще не запустится, но заглушка обязана
     быть читаемой и в этот момент. -->
<div class="too-small">
  <svg class="icon icon--48" aria-hidden="true"><use href="/design-system/assets/icons.svg#i-girih-tile"/></svg>
  <span class="empty__title" data-i18n="err.tooSmall.title">Разверните окно</span>
  <span class="empty__hint" data-i18n="err.tooSmall.hint">АРМ рассчитан на ширину от 1280 пикселей.
    Разверните окно браузера на весь экран.</span>
</div>

<noscript>
  <div class="canvas empty">
    <span class="empty__title">Нужен JavaScript</span>
    <span class="empty__hint">АРМ — приложение, включите JavaScript в браузере.</span>
  </div>
</noscript>

<script type="module" src="/apps/tson/js/app.js"></script>
<script type="module" src="/design-system/js/app-shell.js"></script>
</body>
</html>

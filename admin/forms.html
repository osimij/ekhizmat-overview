<!doctype html>
<html lang="tg" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>eKhizmat · Китобхонаи шаклҳо</title>
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme")||localStorage.getItem("ekh.preferences.theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="icon" href="/design-system/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/design-system/global.css">
<link rel="stylesheet" href="/apps/admin/app.css">
</head>
<body data-platform="admin">

<div class="bp-bar" data-dev-only data-prototype>
  <span class="bp-tag"><svg><use href="/design-system/assets/icons.svg#i-star8"/></svg>Макет</span>
  <label for="bpnav">Экран</label>
  <select class="bp-select" id="bpnav" data-nav aria-label="Гузариш ба экран"></select>
  <div class="bp-right"><button class="icon-btn" data-theme-toggle aria-label="Иваз кардани тема"><svg class="th-moon"><use href="/design-system/assets/icons.svg#i-moon"/></svg><svg class="th-sun"><use href="/design-system/assets/icons.svg#i-sun"/></svg></button></div>
</div>

<div class="adm">
  <aside class="adm-rail" data-bld-rail data-active="forms"></aside>
  <div class="adm-main">
    <div class="adm-top">
      <span class="at-title" id="formsTopTitle">Шаклҳо</span>
      <label class="at-search" for="formsSearch"><svg><use href="/design-system/assets/icons.svg#i-search"/></svg><input id="formsSearch" type="search" autocomplete="off" aria-label="Ҷустуҷӯи шакл" placeholder="Ҷустуҷӯи шакл, идора ё рамз…"></label>
      <div class="at-right">
        <button class="icon-btn" data-theme-toggle aria-label="Тема"><svg class="th-moon"><use href="/design-system/assets/icons.svg#i-moon"/></svg><svg class="th-sun"><use href="/design-system/assets/icons.svg#i-sun"/></svg></button>
        <span class="avatar" style="background:var(--h-indigo-bg);color:var(--h-indigo-fg)">АК</span>
      </div>
    </div>

    <main class="adm-body forms-library">
      <header class="adm-h forms-library__head">
        <div>
          <div class="forms-eyebrow"><svg><use href="/design-system/assets/icons.svg#i-doc"/></svg><span id="formsEyebrow">Китобхонаи мустақил</span></div>
          <h1 id="formsTitle">Шаклҳо</h1>
          <p id="formsLead">Шаклро як бор созед, нусхаҳояшро идора кунед ва дар ҳар хизмати лозим истифода баред.</p>
        </div>
        <a class="btn btn-pri" href="form-builder.html?new=1"><svg><use href="/design-system/assets/icons.svg#i-plus"/></svg><span id="newFormLabel">Шакли нав</span></a>
      </header>

      <section class="forms-stats" id="formsStats" aria-label="Хулосаи шаклҳо"></section>

      <section class="panel forms-catalog-panel">
        <div class="panel-h forms-toolbar">
          <div><h2 id="allFormsLabel">Ҳамаи шаклҳо</h2><p id="formsCountLabel"></p></div>
          <div class="seg" id="formsFilter" role="radiogroup" aria-label="Филтри шаклҳо">
            <label><input type="radio" name="formStatus" value="all" checked><span id="filterAll">Ҳама</span></label>
            <label><input type="radio" name="formStatus" value="live"><span id="filterLive">Зинда</span></label>
            <label><input type="radio" name="formStatus" value="draft"><span id="filterDraft">Сиёҳнавис</span></label>
            <label><input type="radio" name="formStatus" value="archived"><span id="filterArchived">Бойгонӣ</span></label>
          </div>
        </div>
        <div class="forms-list" id="formsList" aria-live="polite"></div>
        <div class="reg-empty" id="formsEmpty" hidden>
          <svg><use href="/design-system/assets/icons.svg#i-search"/></svg>
          <b id="formsEmptyTitle">Ягон шакл ёфт нашуд</b>
          <p id="formsEmptyBody">Ҷустуҷӯ ё филтрро тағйир диҳед.</p>
        </div>
      </section>
    </main>
  </div>
</div>

<script type="module" src="/apps/admin/js/builder.js"></script>
<script type="module" src="/apps/admin/js/forms.js"></script>
<script type="module" src="/design-system/js/app-shell.js"></script>
</body>
</html>

<!doctype html>
<html lang="tg" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>eKhizmat · Китобхонаи шаклҳо</title>
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme")||localStorage.getItem("ekh.preferences.theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){};try{if(localStorage.getItem("ekh.admin.rail")==="1")document.documentElement.classList.add("side-collapsed")}catch(e){}</script>
<link rel="icon" href="/design-system/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/design-system/global.css">
<link rel="stylesheet" href="/apps/admin/app.css">
<script type="module" blocking="render" src="/apps/admin/js/builder.js"></script>
</head>
<body data-platform="admin">

<div class="bp-bar" data-dev-only data-prototype>
  <span class="bp-tag"><svg><use href="/design-system/assets/icons.svg#i-star8"/></svg>Макет</span>
  <label for="bpnav">Экран</label>
  <select class="bp-select" id="bpnav" data-nav aria-label="Гузариш ба экран"></select>
</div>

<div class="adm">
  <aside class="ekh-side" data-bld-rail data-active="forms"></aside>
  <div class="adm-main">
    <div class="adm-top">
      <span class="at-title" id="formsTopTitle">Шаклҳо</span>
      <div class="at-search"><svg><use href="/design-system/assets/icons.svg#i-search"/></svg><input id="formsSearch" type="search" autocomplete="off" aria-label="Ҷустуҷӯи шакл, идора ё рамз" placeholder="Ҷустуҷӯи шакл, идора ё рамз…"></div>
      <div class="at-right"></div>
    </div>

    <main class="adm-body">
      <div class="adm-h"><div class="row">
        <div><h1 id="formsTitle">Шаклҳо</h1></div>
        <a class="btn services-create-action" href="form-builder.html?new=1"><svg><use href="/design-system/assets/icons.svg#i-plus"/></svg><span id="newFormLabel">Шакли нав</span></a>
      </div></div>

      <div class="reg-stats reg-stats--4" id="formsStats" aria-label="Хулосаи шаклҳо"></div>

      <section class="panel" id="formsCatalog">
        <div class="panel-h service-registry-head">
          <h3 id="allFormsLabel">Ҳамаи шаклҳо</h3>
          <label class="registry-status-filter" for="formStatusFilter">
            <span class="registry-filter-label"><svg aria-hidden="true"><use href="/design-system/assets/icons.svg#i-filter"/></svg><span id="formsFilterLabel">Филтр аз рӯи ҳолат</span></span>
            <span class="registry-filter-field">
              <select id="formStatusFilter" aria-label="Филтр аз рӯи ҳолат">
                <option value="all">Ҳама</option>
                <option value="live">Зинда</option>
                <option value="draft">Сиёҳнавис</option>
                <option value="archived">Бойгонӣ</option>
                <option value="unused">Бе хизмат</option>
              </select>
              <svg aria-hidden="true"><use href="/design-system/assets/icons.svg#i-chev-d"/></svg>
            </span>
          </label>
        </div>
        <div class="ekh-list-head" aria-hidden="true">
          <span id="formsColForm">Шакл</span>
          <span id="formsColFields">Майдонҳо</span>
          <span id="formsColServices">Хизматҳо</span>
          <span id="formsColVersions">Нусхаҳо</span>
        </div>
        <div class="forms-list" id="formsList" aria-live="polite"></div>
        <div class="reg-empty" id="formsEmpty" hidden>
          <svg><use href="/design-system/assets/icons.svg#i-search"/></svg>
          <b id="formsEmptyTitle">Ягон шакл ёфт нашуд</b>
          <p id="formsEmptyBody">Ҷустуҷӯ ё филтрро тағйир диҳед.</p>
        </div>
      </section>
    </main>
  </div>
</div>

<script type="module" src="/apps/admin/js/forms.js"></script>
<script type="module" src="/design-system/js/app-shell.js"></script>
</body>
</html>

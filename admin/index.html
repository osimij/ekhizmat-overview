<!doctype html>
<html lang="tg" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>eKhizmat · Конструктори хизматрасонӣ — Макетҳо</title>
<script>try{var q=new URLSearchParams(location.search),t=q.get("theme")||localStorage.getItem("ekh.preferences.theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){};try{if(localStorage.getItem("ekh.admin.rail")==="1")document.documentElement.classList.add("side-collapsed")}catch(e){}</script>
<link rel="icon" href="/design-system/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/design-system/global.css">
<link rel="stylesheet" href="/apps/admin/app.css">
<script type="module" blocking="render" src="/apps/admin/js/builder.js"></script>
</head>
<body data-platform="admin" class="admin-home">


<!-- blueprint toolbar (dev chrome; hidden in screenshot exports) -->
<div class="bp-bar" data-dev-only data-prototype>
  <span class="bp-tag"><svg><use href="/design-system/assets/icons.svg#i-star8"/></svg>Макет</span>
  <label for="bpnav">Экран</label>
  <select class="bp-select" id="bpnav" data-nav aria-label="Гузариш ба экран"></select>
  <div class="bp-right">
    <button class="icon-btn" id="themeBtn" data-theme-toggle aria-label="Иваз кардани тема">
      <svg class="th-moon"><use href="/design-system/assets/icons.svg#i-moon"/></svg><svg class="th-sun"><use href="/design-system/assets/icons.svg#i-sun"/></svg>
    </button>
  </div>
</div>

<div class="adm">
  <aside class="ekh-side" data-bld-rail data-active="overview"></aside>
  <div class="adm-main">
    <div class="adm-top">
      <span class="at-title">Лавҳаи идора</span>
      <div class="at-right">
        <div class="adm-role-slot" id="adminRoleSlot"></div>
      </div>
    </div>

    <main id="main" class="adm-body admin-overview" data-density="compact">
      <div id="adminDashboard" aria-live="polite"></div>
    </main>
  </div>
</div>

<script type="module" src="/apps/admin/js/dashboard.js"></script>
<script type="module" src="/design-system/js/app-shell.js"></script>
</body>
</html>
